name: Publish Linq Langflow extension
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: langflow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.7"
          python-version: "3.12"
      - name: Verify version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: uv run --locked python -c "import os,tomllib; assert tomllib.load(open('pyproject.toml','rb'))['project']['version'] == os.environ['RELEASE_VERSION']"
      - run: uv sync --locked --extra example
      - run: uv run --locked ruff check src tests examples
      - run: uv run --locked pytest
      - run: uv run --locked lfx extension validate src/lfx_linq --execute-imports
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lfx-linq-distributions
          path: langflow/dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-linq-release
      url: https://pypi.org/p/lfx-linq
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lfx-linq-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
