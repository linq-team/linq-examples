[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lfx-linq"
version = "0.1.0"
description = "Linq messaging components for Langflow"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{name = "Linq", email = "contact@linqapp.com"}]
dependencies = ["lfx>=1.13,<1.14", "linq-python>=0.65,<0.66"]

[project.urls]
Repository = "https://github.com/linq-team/linq-examples"
Documentation = "https://docs.linqapp.com"

[project.entry-points."langflow.extensions"]
lfx-linq = "lfx_linq"

[project.optional-dependencies]
example = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "standardwebhooks>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "respx>=0.22,<1", "ruff>=0.13,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_linq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
